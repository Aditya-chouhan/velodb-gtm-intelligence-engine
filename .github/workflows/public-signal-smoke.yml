name: public signal smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public evidence reachability
        run: python scripts/refresh_public_evidence.py --check
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: public-signal-receipt
          path: data/public_signal_receipt.json
          retention-days: 30
